<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>킨볼 집중훈련 체크보드</title>
<meta name="description" content="여학생 중심 킨볼 집중훈련 실시간 출석·기술체크·기록 앱">
<meta name="theme-color" content="#12324f">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="킨볼체크보드">

<style>
  :root{
    --navy:#12324f; --navy-light:#1F4E79;
    --rose:#e8646f; --rose-bg:#fdf1f2; --rose-border:#f6c9cd;
    --slate:#64748b; --slate-bg:#f1f5f9; --slate-border:#cbd5e1;
    --sky:#3b9fd8; --sky-bg:#eef8fd; --sky-border:#bfe4f5;
    --bg:#f7f8fa; --card:#ffffff; --line:#e2e6ea; --text:#25313d; --muted:#8a96a3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif;}
  .kb-root{font-family:inherit;background:var(--bg);color:var(--text);width:100%;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .kb-header{background:var(--navy);color:#fff;padding:16px 20px;}
  .kb-header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  .kb-dots span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;}
  .kb-dday{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);color:#ffe08a;font-size:12.5px;font-weight:700;vertical-align:middle;white-space:nowrap;}
  .kb-title{font-size:18px;font-weight:700;display:flex;align-items:center;margin-top:4px;}
  .kb-sub{font-size:13px;color:#c3cddb;margin-top:4px;}
  .kb-status{font-size:13px;color:#c3cddb;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .kb-badge{padding:3px 9px;border-radius:99px;font-weight:700;font-size:12px;}
  .kb-badge.coach{background:#f6c945;color:#4a3900;}
  .kb-badge.student{background:#6fd0a6;color:#0a3d24;}
  .kb-btn-refresh, .kb-btn-exit{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .kb-btn-refresh:hover, .kb-btn-exit:hover{background:rgba(255,255,255,.22);}
  .kb-tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);}
  .kb-tab{flex:none;padding:13px 17px;font-size:15px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .kb-tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .kb-content{padding:18px;flex:1;font-size:15px;}
  .kb-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px;}
  .kb-card{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--card);}
  .kb-card h3{margin:0 0 4px;font-size:16.5px;}
  .kb-card p{margin:0 0 8px;font-size:13.5px;color:var(--muted);}
  .kb-chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13.5px;background:#fff;border:1px solid var(--line);margin:2px 3px 0 0;}
  .kb-note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;font-size:14.5px;color:var(--muted);line-height:1.65;}
  .kb-note b{color:var(--navy);}
  table.kb-table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px;}
  .kb-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;}
  table.kb-table th{background:var(--navy);color:#fff;padding:10px 11px;text-align:center;position:sticky;top:0;}
  table.kb-table th:first-child, table.kb-table td:first-child{text-align:left;position:sticky;left:0;background:inherit;min-width:120px;z-index:1;}
  table.kb-table thead th:first-child{background:var(--navy);z-index:2;}
  table.kb-table td{padding:9px 11px;text-align:center;border-bottom:1px solid var(--line);}
  table.kb-table tr:nth-child(even) td{background:#f8fafb;}
  table.kb-table tr.kb-me td{background:#fff6da !important;}
  .kb-role-tag{color:var(--muted);font-size:12.5px;}
  .kb-check{width:19px;height:19px;cursor:pointer;}
  .kb-check:disabled{cursor:not-allowed;opacity:.55;}
  .kb-input{width:68px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-size:14.5px;}
  .kb-input:disabled{background:#f3f4f6;color:#9aa3ad;}
  .kb-switch{display:inline-flex;border:1px solid #d4dae0;border-radius:8px;overflow:hidden;margin-bottom:12px;}
  .kb-switch button{padding:8px 15px;font-size:14px;font-weight:600;border:none;background:#fff;color:var(--muted);cursor:pointer;}
  .kb-switch button.active{background:var(--navy);color:#fff;}
  .kb-hint{font-size:13.5px;color:var(--muted);margin-bottom:10px;}
  .kb-role-block{border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px;background:#fff;}
  .kb-role-block-head{width:100%;text-align:left;padding:12px 14px;border:none;cursor:pointer;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
  .kb-select{border:1px solid #d4dae0;border-radius:8px;padding:9px 11px;font-size:14.5px;background:#fff;margin-right:8px;}
  .kb-log-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;max-width:620px;}
  .kb-field label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
  .kb-field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14.5px;resize:none;font-family:inherit;}
  .kb-field{margin-bottom:12px;}
  .kb-coach-check{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:10px;border-top:1px solid #eef0f2;}
  .kb-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#12324f 0%, #12324f 38%, #f7f8fa 38%);}
  .kb-gate-card{background:#fff;border-radius:16px;padding:28px 26px;max-width:400px;width:100%;box-shadow:0 12px 30px rgba(18,50,79,.18);}
  .kb-gate-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px;text-align:center;}
  .kb-gate-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;}
  .kb-gate-role-btn{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfbfc;cursor:pointer;margin-bottom:10px;transition:.15s;}
  .kb-gate-role-btn:hover{border-color:var(--navy);background:#fff;}
  .kb-gate-role-btn .t{font-weight:700;font-size:15px;color:var(--text);}
  .kb-gate-role-btn .d{font-size:13px;color:var(--muted);margin-top:2px;}
  .kb-gate-panel{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px;}
  .kb-gate-panel input, .kb-gate-panel select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;margin-bottom:8px;}
  .kb-gate-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .kb-gate-btn:hover{background:var(--navy-light);}
  .kb-gate-back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:8px;}
  .kb-gate-err{color:#d1445a;font-size:13px;margin:8px 0;}
  .kb-readonly-note{background:#fff8e6;border:1px solid #f2dfa0;color:#8a6a10;font-size:13.5px;border-radius:8px;padding:9px 13px;margin-bottom:12px;}
  .kb-today-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .kb-today-date{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .kb-today-check-row{display:flex;align-items:center;gap:12px;font-size:17px;cursor:pointer;}
  .kb-check-lg{width:26px;height:26px;cursor:pointer;flex:none;}
  .kb-input-lg{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:10px;box-sizing:border-box;}
  .kb-today-drill-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .kb-today-drill-label{font-weight:700;font-size:15.5px;}
  .kb-hint-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .kb-tip-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:12px;font-weight:700;cursor:pointer;line-height:1;flex:none;padding:0;}
  .kb-tip-btn:hover{background:var(--navy);color:#fff;}
  .kb-tip-box{background:#eef4fb;border:1px solid #cfe0f2;color:#1e4a72;font-size:12.5px;border-radius:8px;padding:10px 12px;margin:0 0 12px;line-height:1.6;}
  .kb-team-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);}
  .kb-team-btn.active{background:var(--tc,var(--navy));color:#fff;border-color:var(--tc,var(--navy));}
  @media (max-width:600px){ .kb-header-row{flex-direction:column;} }
  @media (max-width:480px){
    .kb-content{padding:14px;}
    .kb-tab{padding:11px 13px;font-size:13px;}
    .kb-today-card{padding:14px;}
    .kb-today-check-row{font-size:17px;}
    .kb-cards{grid-template-columns:1fr;}
    .kb-title{font-size:16px;}
    .kb-sub{font-size:11px;}
  }
</style>
</head>
<body>
  <div class="kb-root" id="kbRoot"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
